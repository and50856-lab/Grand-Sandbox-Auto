name: Build Grand Sandbox Auto

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: |
          sdkmanager \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "cmdline-tools;latest" \
            "cmake;3.10.2.4988404" \
            "ndk;28.1.13356709"

      - name: Download Godot 4.5
        run: |
          wget https://github.com/godotengine/godot/releases/download/4.5-stable/Godot_v4.5-stable_linux.x86_64.zip
          unzip Godot_v4.5-stable_linux.x86_64.zip
          chmod +x Godot_v4.5-stable_linux.x86_64
          sudo mv Godot_v4.5-stable_linux.x86_64 /usr/local/bin/godot

      - name: Download Godot export templates
        run: |
          wget https://github.com/godotengine/godot/releases/download/4.5-stable/Godot_v4.5-stable_export_templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/4.5.stable
          unzip -o Godot_v4.5-stable_export_templates.tpz -d /tmp/godot-templates
          cp -r /tmp/godot-templates/templates/. ~/.local/share/godot/export_templates/4.5.stable/

      - name: Configure Android paths
        run: |
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-4.tres <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF

      - name: Import project
        run: |
          godot --headless --editor --path . --import

      - name: Validate GDScript
        shell: bash
        run: |
          set +e
          godot --headless --editor --path . --quit 2>&1 | tee godot-validation.log
          GODOT_EXIT=${PIPESTATUS[0]}
          set -e

          if [ "$GODOT_EXIT" -ne 0 ]; then
            echo "Godot validation process failed."
            exit "$GODOT_EXIT"
          fi

          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script" godot-validation.log; then
            echo "GDScript validation failed."
            exit 1
          fi

          echo "GDScript validation passed."

      - name: Build Android APK
        run: |
          mkdir -p build
          godot --headless --path . --export-debug "Android" build/GrandSandboxAuto.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Grand-Sandbox-Auto-APK
          path: build/GrandSandboxAuto.apk
          if-no-files-found: error
          retention-days: 14
